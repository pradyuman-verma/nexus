[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Nexus — a context capture protocol: forward links, notes, voice notes, and photos from any chat channel into a private knowledge brain"
license = "MIT"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Telegram
teloxide = { version = "0.13", features = ["macros"] }

# Webhook channels (WhatsApp Cloud API)
axum = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
pgvector = { version = "0.4", features = ["sqlx"] }

# HTTP + content extraction
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
    "multipart",
] }
scraper = "0.21"
html2text = "0.12"

# Scheduling
tokio-cron-scheduler = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
